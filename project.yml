name: WebSyncroClient
options:
  bundleIdPrefix: it.websyncro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone & iPad
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "EX Novo"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIRequiresFullScreen: "NO"
    INFOPLIST_KEY_NSCameraUsageDescription: "Usa la fotocamera per scansionare codici QR e fotografare i fogli di carico dell'inventario."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Accedi alla libreria foto per caricare ricevute e fogli di carico dell'inventario."
    INFOPLIST_KEY_NSAppTransportSecurity:
      NSAllowsArbitraryLoads: true

targets:
  WebSyncroClient:
    type: application
    platform: iOS
    sources:
      - path: Sources/WebSyncroClient
    dependencies:
      - target: WebSyncroWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.websyncro.client
        PRODUCT_NAME: WebSyncroClient
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

  WebSyncroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/WebSyncroWidgets
      - path: Sources/WebSyncroClient/Utilities/WidgetDataProvider.swift
      - path: Sources/WebSyncroClient/Utilities/CurrencyFormatter.swift
      - path: Sources/WebSyncroClient/Views/Components/Color+Brand.swift
      - path: Sources/WebSyncroClient/Views/Components/LiquidGlassCard.swift
      - path: Sources/WebSyncroClient/Views/Widgets/WebSyncroWidgetViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.websyncro.client.widgets
        PRODUCT_NAME: WebSyncroWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "WebSyncro Widgets"
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"

  WebSyncroClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WebSyncroClientTests
    dependencies:
      - target: WebSyncroClient

